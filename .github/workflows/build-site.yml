name: 대시보드 데이터 갱신

on:
  schedule:
    - cron: "40 17 * * *"          # 한국시간 02:40 (일일 수집 후)
    - cron: "30 0,3,6,9,12 * * *"  # 한국시간 09:30·12:30·15:30·18:30·21:30
  push:
    paths: ["docs/index.html", "scripts/build_site.py", "data/manual/**"]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: commit-data
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          for i in 1 2 3; do
            git fetch origin main
            git reset --hard origin/main
            python scripts/build_site.py
            git add docs/data
            if git diff --cached --quiet; then echo "변경 없음"; exit 0; fi
            git commit -m "대시보드 데이터 $(date -u +%F)"
            if git push; then exit 0; fi
            echo "충돌 - 10초 후 재시도 ($i)"
            sleep 10
          done
          exit 1
