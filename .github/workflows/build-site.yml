name: 대시보드 데이터 갱신

on:
  schedule:
    - cron: "40 17 * * *"          # 한국시간 02:40 (일일 수집 후)
    - cron: "30 0,3,6,9,12 * * *"  # 한국시간 09:30·12:30·15:30·18:30·21:30
  push:
    paths: ["docs/index.html", "scripts/build_site.py", "data/manual/**"]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: commit-data
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python scripts/build_site.py
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/data
          git diff --cached --quiet && exit 0
          git commit -m "대시보드 데이터 $(date -u +%F)"
          git pull --rebase
          git push
