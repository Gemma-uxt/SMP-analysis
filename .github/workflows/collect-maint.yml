name: 예방정비계획 수집
on:
  schedule:
    - cron: "20 1 * * *"   # 한국시간 10:20
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: commit-data
  cancel-in-progress: false
jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install requests pdfplumber
      - run: python scripts/collect_maint.py
      - name: 저장
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@users.noreply.github.com"
          git add -A data/raw/maint docs/data
          git diff --cached --quiet || git commit -m "예방정비계획 $(date -u +%F)"
          git pull --rebase
          git push
