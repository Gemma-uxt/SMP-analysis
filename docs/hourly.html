<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>시간별 SMP와 가격결정 연료</title>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700;800&display=swap" rel="stylesheet">
<style>
/* VOICE: 본부장 보고용 분석 화면, 기존 월간 보고서와 같은 양식
   IDEA: 시간별 SMP 선과 그 아래 '누가 가격을 정했나' 띠를 한 축에 맞춰 읽는 화면
   PICTURE: 시간별 SMP 선그래프 + 같은 시간축의 연료 띠
   COLOUR and TYPE: 네이비 #0B3D66 바탕 양식, 연료 4색(회색·파랑·보라·노랑), Noto Sans KR
   LAYOUT: 제목·월 선택 → 연료별 시간 요약 → 선그래프 → 연료 띠 → 주석 */
:root{color-scheme:light;--navy:#0B3D66;--ci:#00A6ED;--ink:#1A2230;--ink2:#3F4856;--ink3:#6B7585;--line:#D9DFE7;--tint:#F2F6FA;
 --coal:#8F99A6;--ind:#3399FF;--avg:#9B30B0;--etc:#F0B400}
*{box-sizing:border-box;min-width:0}
body{margin:0;background:#E4E7EC;color:var(--ink);font:15px/1.5 "Noto Sans KR","Malgun Gothic",sans-serif;overflow-x:clip}
.toc{position:sticky;top:0;z-index:5;background:#fff;border-bottom:1px solid var(--line);display:flex;gap:6px;overflow-x:auto;padding:8px max(3vw,12px)}
.toc a{flex:none;font-size:13px;color:var(--ink2);text-decoration:none;padding:6px 10px;border-radius:4px;border:1px solid var(--line)}
.toc a.nv{background:var(--navy);color:#fff;border-color:var(--navy)}
.toc a:hover,.toc a:focus-visible{border-color:var(--ci);outline:none}
.slide{background:#fff;max-width:1180px;margin:22px auto;padding:28px 36px 22px;box-shadow:0 2px 10px rgba(20,30,50,.08);display:flex;flex-direction:column;gap:14px}
.hd{display:flex;align-items:center;gap:12px;border-bottom:2px solid var(--navy);padding-bottom:10px;flex-wrap:wrap}
.pno{background:var(--navy);color:#fff;font-weight:800;font-size:17px;padding:3px 10px;border-radius:2px}
.pt{font-size:24px;font-weight:800;color:var(--navy);letter-spacing:-.5px}
.pt small{font-size:14px;font-weight:500;color:var(--ink3);margin-left:8px}
.months{margin-left:auto;display:flex;gap:6px;flex-wrap:wrap}
.months label{display:flex;align-items:center;gap:6px;border:1px solid var(--line);padding:7px 12px;border-radius:4px;cursor:pointer;font-weight:700;font-size:14px;min-height:40px}
.months input{width:18px;height:18px;accent-color:var(--navy);margin:0}
.months label:has(input:checked){border-color:var(--navy);background:var(--tint);color:var(--navy)}
.msg{background:var(--tint);border-left:5px solid var(--ci);padding:10px 16px;font-size:17px;font-weight:700;color:var(--navy);text-wrap:balance}
.sum{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:10px}
.chip{border:1px solid var(--line);border-top:4px solid;padding:8px 12px}
.chip .l{font-size:13px;font-weight:700;color:var(--ink2)}
.chip .v{font-size:24px;font-weight:800;letter-spacing:-.5px}
.chip .s{font-size:12.5px;color:var(--ink3)}
.box{border:1px solid var(--line);padding:12px 14px}
.bt{font-weight:700;color:var(--navy);border-left:4px solid var(--ci);padding-left:8px;margin-bottom:6px;display:flex;justify-content:space-between;gap:8px;flex-wrap:wrap}
.bt small{font-weight:400;color:var(--ink3);font-size:12px}
.fig{position:relative;height:360px}.strip{position:relative;height:96px;margin-top:2px}
.lg{display:flex;gap:14px;flex-wrap:wrap;font-size:13px;color:var(--ink2);margin-top:6px}
.lg i{display:inline-block;width:12px;height:12px;border-radius:2px;margin-right:5px;vertical-align:-1px}
.note{font-size:12px;color:var(--ink3)}
.empty{padding:40px;text-align:center;color:var(--ink3)}
@media(max-width:760px){.slide{padding:18px 12px;margin:10px 4px}.sum{grid-template-columns:repeat(2,minmax(0,1fr))}.months{margin-left:0}.fig{height:300px}}
</style>
</head>
<body>
<nav class="toc" aria-label="이동">
  <a class="nv" href="index.html">◀ 월간 검토 결과</a><a href="report.html">월별 상세 보고서</a>
</nav>

<section class="slide">
  <div class="hd">
    <span class="pno">참고</span><span class="pt">시간별 SMP와 가격결정 연료<small id="per"></small></span>
    <div class="months" id="months" role="group" aria-label="표시할 달"></div>
  </div>
  <div class="msg" id="msg">자료를 불러오는 중…</div>
  <div class="sum" id="sum"></div>
  <div class="box">
    <div class="bt">시간별 SMP<small>원/kWh · 선에 마우스를 올리면 추정 가격결정 발전기·연료 표시</small></div>
    <div class="fig"><canvas id="cL" role="img" aria-label="시간별 SMP 선그래프"></canvas></div>
    <div class="bt" style="margin-top:10px">시간별 가격결정 연료 (추정)<small>한 칸 = 1시간 · 위 그래프와 같은 시간축</small></div>
    <div class="strip"><canvas id="cS" role="img" aria-label="시간별 가격결정 연료 띠"></canvas></div>
    <div class="lg" id="lg"></div>
  </div>
  <div class="note" id="note"></div>
</section>

<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.min.js"></script>
<script>
{
const $=id=>document.getElementById(id);
const CAT={coal:['석탄','#8F99A6'],ind:['개별연료비·직도입 LNG','#3399FF'],avg:['평균연료비 LNG','#9B30B0'],etc:['기타','#F0B400']};
const ORDER=['coal','ind','avg','etc'];
const f1=v=>v==null?'-':(+v).toLocaleString('ko-KR',{minimumFractionDigits:1,maximumFractionDigits:1});
const DOW='일월화수목금토';
$('lg').innerHTML=ORDER.map(k=>`<span><i style="background:${CAT[k][1]}"></i>${CAT[k][0]}</span>`).join('');
let D=null,chL=null,chS=null;
const OK=!!window.Chart;
if(OK){Chart.defaults.font.family='"Noto Sans KR","Malgun Gothic",sans-serif';Chart.defaults.font.size=12;Chart.defaults.color='#5A6474';Chart.defaults.maintainAspectRatio=false;Chart.defaults.animation=false}
const YW=52; /* 두 그래프 왼쪽 축 폭을 맞춰 시간축 정렬 */
const tipStyle={backgroundColor:'rgba(255,255,255,.97)',titleColor:'#0B3D66',bodyColor:'#1A2230',borderColor:'#C9D2DD',borderWidth:1,padding:10,displayColors:false,titleFont:{size:13,weight:'800'},bodyFont:{size:12}};

function rows(){const ms=[...document.querySelectorAll('#months input:checked')].map(x=>x.value);
  const out=[];Object.keys(D.days).sort().forEach(d=>{if(!ms.includes(d.slice(0,7)))return;const r=D.days[d];
    for(let h=0;h<24;h++)out.push({d,h,smp:r.smp[h],u:r.u[h],lb:r.lb[h],c:r.c[h],wd:r.wd,a:r.a})});return {ms,out}}
function title(p){const dt=new Date(p.d+'T00:00:00');return `${+p.d.slice(5,7)}/${+p.d.slice(8)}(${DOW[dt.getDay()]}) ${p.h+1}시 · ${p.wd?'평일':'주말·공휴일'}`}
function body(p){const o=[`SMP ${f1(p.smp)}원/kWh`,'',`추정 가격결정 발전기: ${p.u}`,(p.lb===CAT[p.c][0]?`연료: ${p.lb}`:`연료: ${p.lb} (${CAT[p.c][0]})`)];
  const a=Object.entries(p.a||{});if(a.length)o.push('',`그날 공식 연료별 결정(24시간): ${a.map(([k,v])=>k+' '+v).join(' · ')}`);return o}

function render(){
  const {ms,out}=rows();
  if(!out.length){$('msg').textContent='표시할 달을 하나 이상 고르세요';$('sum').innerHTML='';if(chL){chL.destroy();chS.destroy();chL=chS=null}return}
  const first=out[0].d,last=out[out.length-1].d;
  $('per').textContent=`${+first.slice(5,7)}.${+first.slice(8)}~${+last.slice(5,7)}.${+last.slice(8)}`;
  const cnt={coal:0,ind:0,avg:0,etc:0},sm={coal:[],ind:[],avg:[],etc:[]};out.forEach(p=>{cnt[p.c]++;sm[p.c].push(p.smp)});
  const n=out.length,mean=a=>a.length?a.reduce((s,v)=>s+v,0)/a.length:null;
  $('sum').innerHTML=ORDER.map(k=>`<div class="chip" style="border-top-color:${CAT[k][1]}"><div class="l">${CAT[k][0]}</div><div class="v">${(cnt[k]/n*100).toFixed(1)}%</div><div class="s">${cnt[k]}시간 · 평균 SMP ${f1(mean(sm[k]))}원</div></div>`).join('');
  const top=ORDER.slice().sort((a,b)=>cnt[b]-cnt[a])[0];
  $('msg').innerHTML=`선택 기간 ${n.toLocaleString()}시간 중 가격을 가장 많이 정한 연료: <span style="color:${CAT[top][1]}">${CAT[top][0]}</span>(${(cnt[top]/n*100).toFixed(0)}%) · 평균연료비 LNG가 정한 시간의 평균 SMP ${f1(mean(sm.avg))}원`;
  const labels=out.map(p=>p.h===0?`${+p.d.slice(5,7)}/${+p.d.slice(8)}`:'');
  if(!OK)return;
  if(chL){chL.destroy();chS.destroy()}
  const tick={autoSkip:false,maxRotation:0,callback:(v,i)=>{const p=out[i];if(p.h!==0)return null;const day=+p.d.slice(8);const step=out.length>24*40?7:out.length>24*20?3:1;return (day-1)%step===0?labels[i]:null}};
  chL=new Chart($('cL'),{type:'line',data:{labels,datasets:[{data:out.map(p=>p.smp),borderColor:'#0B3D66',borderWidth:1.5,pointRadius:0,pointHoverRadius:5,pointHoverBackgroundColor:out.map(p=>CAT[p.c][1]),tension:0}]},
    options:{interaction:{mode:'index',intersect:false},plugins:{legend:{display:false},tooltip:{...tipStyle,callbacks:{title:c=>title(out[c[0].dataIndex]),label:c=>body(out[c.dataIndex])}}},
      scales:{x:{grid:{color:c=>out[c.index]&&out[c.index].h===0?'#E3E8EE':'transparent'},ticks:tick},y:{afterFit:a=>{a.width=YW},grid:{color:'#EEF1F5'},title:{display:true,text:'원/kWh'}}}}});
  chS=new Chart($('cS'),{type:'bar',data:{labels,datasets:[{data:out.map(()=>1),backgroundColor:out.map(p=>CAT[p.c][1]),barPercentage:1,categoryPercentage:1,borderWidth:0}]},
    options:{interaction:{mode:'index',intersect:false},plugins:{legend:{display:false},tooltip:{...tipStyle,callbacks:{title:c=>title(out[c[0].dataIndex]),label:c=>body(out[c.dataIndex])}}},
      scales:{x:{grid:{display:false},ticks:tick},y:{display:true,min:0,max:1,afterFit:a=>{a.width=YW},ticks:{display:false},grid:{display:false},border:{display:false}}}}});
}

fetch('data/hourly_est.json?'+Date.now()).then(r=>{if(!r.ok)throw new Error(r.status);return r.json()}).then(j=>{D=j;
  const ms=[...new Set(Object.keys(D.days).map(d=>d.slice(0,7)))].sort();
  const lastM=ms[ms.length-1];
  $('months').innerHTML=ms.map(m=>{const ds=Object.keys(D.days).filter(d=>d.startsWith(m)).sort(),e=+ds[ds.length-1].slice(8),full=new Date(+m.slice(0,4),+m.slice(5),0).getDate();
    return `<label><input type="checkbox" value="${m}" ${m===lastM?'checked':''}>${+m.slice(5)}월${e<full?` (~${e}일)`:''}</label>`}).join('');
  $('months').onchange=render;
  $('note').textContent=`※ SMP: KPX 육지 시간별 · 가격결정 발전기·연료는 사업기획팀 발전가격 순위표의 단가와 순위 위치로 추정하고, 날짜별 석탄·LNG 시간 수는 전력거래소 연료별 SMP 결정 횟수에 맞춤 — SMP에는 무부하·기동가격이 포함돼 순위표 단가와 정확히 같지 않으므로 발전기는 추정치 · 'LNG(평균·직도입)' 혼합 발전기는 평균연료비, 원자력·LPG·중유·도시가스 LNG 등은 기타로 분류 · 기간 ${D.from}~${D.to}`;
  render()}).catch(e=>{$('msg').textContent='자료를 불러오지 못했습니다: '+e.message});
}
</script>
</body>
</html>
