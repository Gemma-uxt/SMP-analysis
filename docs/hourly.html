<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>시간별 SMP와 가격결정 연료</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700;800;900&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.min.js"></script>
<style>
/* =====================================================================
   삼천리 사업기획팀 보고서 표준 템플릿 v1 (2026.10)
   - 슬라이드 1280 x 720, 흰 바탕 / 바깥 회색 배경 + 그림자
   - 내용 박스 전부 직각, 본문 17px 이상, 헤드라인 24px
   - 숫자 카운트업·요소 등장 애니메이션 없음
   ※ 이 <style> 블록은 수정하지 말고, 슬라이드 내용만 바꿀 것
   ===================================================================== */
:root{
  --ci:#00A6ED;--blue:#0096DC;--blue-ink:#0080C4;--navy:#0B3D66;
  --soft:#E6F6FD;--tint:#F2F9FD;--gray-bg:#F1F5F9;
  --slate:#B4BECB;--slate-d:#6F7D90;--slate-l:#EEF1F5;
  --ink:#1A2230;--ink2:#3F4856;--ink3:#6B7585;--line:#D9DFE7;
  --red:#D93A3F;--red-l:#FDECEC;--amber:#9A6412;--amber-l:#FFF4D6;
}
*{box-sizing:border-box;margin:0;padding:0;border-radius:0}
html,body{height:100%;background:#E5E7EB}
body{font-family:"Noto Sans KR","Noto Sans CJK KR","Malgun Gothic",sans-serif;color:var(--ink);
  word-break:keep-all;overflow-wrap:break-word;line-break:strict;
  -webkit-print-color-adjust:exact;print-color-adjust:exact;overflow:hidden}
b,strong{font-weight:700}

/* ---------- 덱 ---------- */
#deck{position:fixed;inset:0;background:#E5E7EB}
#stage{width:1280px;height:720px;position:absolute;left:50%;top:calc(50% - 28px);margin:-360px 0 0 -640px;transform-origin:center center}
.slide{position:absolute;inset:0;background:#fff;overflow:hidden;box-shadow:0 2px 14px rgba(15,30,50,.18);display:none;flex-direction:column}
.slide.active{display:flex}

/* ---------- 페이지 제목 + 헤드라인 박스 ---------- */
.hd{display:flex;align-items:center;gap:14px;margin:30px 52px 0;padding-bottom:11px;border-bottom:2px solid var(--navy)}
.pno{background:var(--navy);color:#fff;font-weight:700;font-size:20px;min-width:40px;height:38px;padding:0 9px;display:grid;place-items:center}
.pt{font-size:30px;font-weight:800;color:var(--navy);letter-spacing:-.6px;line-height:normal}
.pt small{font-size:19px;color:var(--ink3);font-weight:500;margin-left:10px;letter-spacing:0}
.hd .lk{font-family:inherit;font-size:15px;font-weight:600;color:var(--navy);background:#fff;border:1.5px solid var(--navy);padding:4px 12px;cursor:pointer}
.hd .lk:hover{background:var(--navy);color:#fff}
.hd .mo{margin-left:auto;font-size:14px;color:var(--ink3)}
.msg{margin:14px 52px 0;background:var(--gray-bg);border-left:6px solid var(--ci);padding:11px 22px;
  font-size:24px;font-weight:700;color:var(--navy);letter-spacing:-.5px;line-height:1.38}
.bd{flex:1;min-height:0;padding:0 52px;display:flex;flex-direction:column;gap:14px}
.ft{margin-top:8px;padding:7px 52px 16px;display:flex;justify-content:flex-end;align-items:center;font-size:12px}
.ft .pg{font-weight:700;color:#56657a;font-size:14px}

/* ---------- 카드 ---------- */
.card{background:#fff;border:1px solid var(--line);box-shadow:0 2px 6px rgba(20,50,90,.06);display:flex;flex-direction:column;overflow:hidden;position:relative}
.card .ch{background:var(--navy);color:#fff;text-align:center;font-size:18px;font-weight:700;padding:8px 12px}
.card .ch.blue{background:var(--blue)} .card .ch.gray{background:var(--slate-d)}
.card .cb{padding:12px 18px;flex:1;display:flex;flex-direction:column;gap:8px;min-height:0}
.sh{display:flex;align-items:center;justify-content:space-between;gap:10px;font-size:19px;font-weight:700;color:var(--navy);line-height:1.3;border-left:4px solid var(--ci);padding-left:10px}
.sh small{font-weight:400;color:var(--ink3);font-size:14px}
.row{display:flex;gap:14px;min-height:0} .f1{flex:1;min-width:0}
.tx{font-size:17px;line-height:1.5;color:var(--ink2)} .tx b{color:var(--ink)}
.note{font-size:14.5px;color:var(--ink3);line-height:1.5}
.em{color:var(--blue-ink);font-weight:700} .rd{color:var(--red);font-weight:700}
ul.d{list-style:none}
ul.d>li{position:relative;padding-left:16px;font-size:17px;line-height:1.5;margin-bottom:3px;color:var(--ink2)}
ul.d>li b{color:var(--ink)}
ul.d>li::before{content:"";position:absolute;left:2px;top:.64em;width:7px;height:7px;background:var(--ci)}
.tag{display:inline-block;padding:2px 10px;font-size:15px;font-weight:700;white-space:nowrap}
.t-neu{background:var(--slate-l);color:var(--ink2)} .t-up{background:var(--soft);color:var(--blue-ink)}
.t-dn{background:var(--red-l);color:var(--red)} .t-unk{background:var(--amber-l);color:var(--amber)}
.num{width:28px;height:28px;background:var(--navy);color:#fff;font-weight:900;font-size:17px;display:grid;place-items:center;flex:none}
.num.r{background:var(--red)} .num.b{background:var(--blue)} .num.g{background:var(--slate-d)}
.bx{padding:10px 16px;background:var(--tint);border-left:5px solid var(--ci);font-size:17px;line-height:1.5;color:var(--ink2)}
.bx.r{background:var(--red-l);border-left-color:var(--red)}

/* ---------- 표 ---------- */
table.t{width:100%;border-collapse:collapse;font-size:16px;font-variant-numeric:tabular-nums}
.t th{background:var(--navy);color:#fff;font-weight:700;padding:7px 11px;text-align:left}
.t th.r,.t td.r{text-align:right}
.t td{padding:7px 11px;border-bottom:1px solid var(--line);vertical-align:middle;line-height:1.42;color:var(--ink2)}
.t td.rh{font-weight:700;color:var(--ink)}
.t tr.hl td{background:var(--soft);font-weight:700;color:var(--navy)}
.t tbody tr:hover td{background:#EAF6FC}
.t tr:last-child td{border-bottom:0}
.up{color:var(--red)} .dn{color:var(--blue-ink)}

/* ---------- KPI ---------- */
.kpis{display:grid;grid-template-columns:repeat(4,1fr);gap:14px}
.kpi{padding:10px 16px;border-top:4px solid var(--ci)}
.kpi .k1{font-size:16px;font-weight:700;color:var(--ink2)}
.kpi .k2{font-size:38px;font-weight:900;letter-spacing:-1px;line-height:1.15;margin-top:2px;color:var(--ink)}
.kpi .k2 small{font-size:18px;font-weight:700;margin-left:3px}
.kpi .k2.b{color:var(--blue-ink)}
.kpi .k3{font-size:14.5px;color:var(--ink3)}

/* ---------- 차트 영역 ---------- */
.cv{position:relative;flex:1;min-height:0} .cv canvas{position:absolute;inset:0}

/* ---------- 흐름 칩 ---------- */
.chips{display:flex;align-items:center;justify-content:center;gap:10px}
.chip{padding:8px 16px;font-size:17px;font-weight:700;background:var(--slate-l);color:var(--ink)}
.chip.s{background:var(--navy);color:#fff} .chip.e{background:var(--red-l);color:var(--red);border:1px solid #F0BCBE}
.arw{color:var(--ci);font-size:22px;font-weight:700}

/* ---------- 표지 ---------- */
.cover{flex-direction:row}
.cover .lt{width:55%;padding:0 0 0 76px;display:flex;flex-direction:column;justify-content:center;position:relative}
.cover .logo{position:absolute;left:76px;top:52px;height:44px;width:auto}
.cover .kick{font-size:20px;color:var(--ink2);font-weight:500}
.cover h1{margin-top:14px;font-size:54px;line-height:1.2;font-weight:900;letter-spacing:-2px;color:var(--ink)}
.cover h1 .b{color:var(--ci)}
.cover .sub{margin-top:20px;font-size:18px;color:var(--ink3);line-height:1.6}
.cover .pills{display:flex;gap:10px;margin-top:44px;flex-wrap:wrap}
.cover .pills span{padding:10px 20px;font-size:16px;color:var(--ink2);border:1px solid var(--line);background:#fff}
.cover .rt{flex:1;position:relative}
.cover .rt svg{position:absolute;right:20px;top:50%;width:560px;transform:translateY(-50%)}
.px{transition:transform .25s ease-out}
.flow{stroke-dasharray:7 7;animation:flow 1.1s linear infinite} @keyframes flow{to{stroke-dashoffset:-28}}
.pulse{animation:pulse 2.4s ease-in-out infinite;transform-origin:center;transform-box:fill-box}
@keyframes pulse{0%,100%{transform:scale(1);opacity:.55}50%{transform:scale(1.25);opacity:.15}}

/* ---------- 내비게이션 ---------- */
.nav{position:fixed;left:0;right:0;bottom:0;height:56px;display:flex;align-items:center;justify-content:center;gap:10px;background:#D5D9E0;font-size:14px;z-index:20}
.nav button,.nav select{background:#fff;color:#14202e;border:1px solid #AEB6C2;padding:6px 14px;font:inherit;font-size:14px;cursor:pointer}
.nav select{min-width:330px}
.nav button:hover{background:var(--ci);color:#fff}
#print{background:var(--ci);color:#fff;border-color:var(--ci);font-weight:700}

/* ---------- 인쇄 / PDF (1280 x 720) ---------- */
@page{size:1280px 720px;margin:0}
@media print{
  html,body{overflow:visible;height:auto;background:#fff}
  #deck{position:static} #stage{transform:none!important;width:auto;height:auto;position:static;margin:0}
  .slide{display:flex!important;position:relative;inset:auto;width:1280px;height:720px;box-shadow:none;break-after:page}
  .slide:last-child{break-after:auto}
  .nav{display:none!important} .flow,.pulse{animation:none}
}
</style>
<style>
/* ---------- 이 페이지 전용 보완 ---------- */
.months{margin-left:auto;display:flex;gap:8px;align-items:center}
.months label{display:flex;align-items:center;gap:7px;border:1.5px solid var(--line);padding:4px 12px;cursor:pointer;font-weight:700;font-size:15px;color:var(--ink3)}
.months input{width:17px;height:17px;accent-color:var(--navy);margin:0}
.months label:has(input:checked){border-color:var(--navy);color:var(--navy);background:var(--tint)}
.hd .lk[aria-pressed=true]{background:var(--navy);color:#fff}
#sum{display:grid;grid-template-columns:repeat(5,1fr);gap:14px}
#sum .kpi{padding:6px 14px} #sum .kpi .k1{font-size:15px} #sum .kpi .k2{font-size:26px;display:inline-block;margin-right:8px} #sum .kpi .k3{display:inline} #sum .ref{background:var(--tint);border-top-color:var(--navy)}
.strip{position:relative;height:56px} .strip canvas{position:absolute;inset:0}
.lg{display:flex;gap:18px;font-size:14.5px;color:var(--ink2);font-weight:400}
.lg i{display:inline-block;width:12px;height:12px;margin-right:6px;vertical-align:-1px}
.nav .navlink{background:var(--navy);color:#fff;border:1px solid var(--navy);padding:6px 14px;font-size:14px;text-decoration:none}
.nav .navlink:hover{background:var(--ci);border-color:var(--ci)}
</style>
</head>
<body>
<div id="deck"><div id="stage">

<section class="slide">
  <div class="hd"><span class="pno">참고</span><span class="pt">시간별 SMP와 가격결정 연료<small id="per"></small><small>평일만</small></span>
    <div class="months" id="months" role="group" aria-label="표시할 달"></div></div>
  <div class="msg" id="msg">자료를 불러오는 중…</div>
  <div class="bd">
    <div id="sum"></div>
    <div class="card f1"><div class="cb">
      <div class="sh"><span>시간별 SMP<small style="margin-left:8px">원/kWh</small> · 아래 띠: 가격결정 연료(추정)</span><span class="lg" id="lg"></span></div>
      <div class="cv"><canvas id="cL" role="img" aria-label="시간별 SMP 선그래프"></canvas></div>
      <div class="strip"><canvas id="cS" role="img" aria-label="시간별 가격결정 연료 띠"></canvas></div>
    </div></div>
    <div class="note" id="note"></div>
  </div>
  <div class="ft"><span class="pg"></span></div>
</section>

</div></div>

<nav class="nav">
  <a class="navlink" href="index.html">◀ 월간 검토 결과</a>
  <a class="navlink" href="report.html">월별 상세 보고서 ▶</a>
  <button id="prev" type="button" hidden>◀ 이전</button>
  <select id="sel" aria-label="슬라이드 선택" hidden></select>
  <button id="next" type="button" hidden>다음 ▶</button>
  <button id="print" type="button">PDF 만들기</button>
</nav>

<script>
/* ===== 덱 제어 (수정 불필요) ===== */
const slides=[...document.querySelectorAll('.slide')],stage=document.getElementById('stage'),sel=document.getElementById('sel');
let cur=0;
function fit(){stage.style.transform=`scale(${Math.min((innerWidth-40)/1280,(innerHeight-56-24)/720)})`}
addEventListener('resize',fit);fit();
slides.forEach((s,i)=>{const no=s.querySelector('.pno'),pt=s.querySelector('.pt');
  sel.add(new Option(i===0?'표지':((no?no.textContent+'. ':'')+(pt?pt.textContent:'')).trim(),i));
  const pg=s.querySelector('.pg');if(pg)pg.textContent=(i+1)+' / '+slides.length});
function go(n){n=Math.max(0,Math.min(slides.length-1,n));slides.forEach((s,i)=>s.classList.toggle('active',i===n));cur=n;sel.value=n;
  history.replaceState(null,'','#'+(n+1));(chartsBySlide[n]||[]).forEach(c=>{c.reset();c.update()})}
function goTo(t){if(typeof t==='number')return go(t);const i=slides.findIndex(s=>s.id===t);if(i>=0)go(i)}
sel.onchange=()=>go(+sel.value);
document.getElementById('prev').onclick=()=>go(cur-1);
document.getElementById('next').onclick=()=>go(cur+1);
document.getElementById('print').onclick=()=>window.print();
addEventListener('keydown',e=>{if(e.target.tagName==='SELECT')return;
  if(['ArrowRight','PageDown',' '].includes(e.key)){e.preventDefault();go(cur+1)}
  if(['ArrowLeft','PageUp'].includes(e.key)){e.preventDefault();go(cur-1)}});
document.addEventListener('mousemove',e=>{const x=e.clientX/innerWidth-.5,y=e.clientY/innerHeight-.5;
  slides[cur].querySelectorAll('.px').forEach(p=>{const d=+p.dataset.depth||6;p.style.transform=`translate(${x*d}px,${y*d}px)`})});

/* ===== Chart.js 공통 설정 (수정 불필요) ===== */
const C={blue:'#0096DC',ci:'#00A6ED',navy:'#0B3D66',slate:'#B4BECB',slateD:'#6F7D90',red:'#D93A3F',amber:'#F2A33A',ink:'#1A2230',ink2:'#3F4856',line:'#E6EAEF'};
const FONT='"Noto Sans KR","Noto Sans CJK KR","Malgun Gothic",sans-serif';
Chart.defaults.font.family=FONT;Chart.defaults.font.size=14;Chart.defaults.color=C.ink2;
Chart.defaults.animation.duration=900;Chart.defaults.maintainAspectRatio=false;
Chart.defaults.plugins.legend.labels.boxWidth=12;Chart.defaults.plugins.legend.labels.boxHeight=12;
Chart.defaults.plugins.tooltip.backgroundColor='rgba(26,34,48,.92)';Chart.defaults.plugins.tooltip.padding=10;Chart.defaults.plugins.tooltip.cornerRadius=0;
/* 값 레이블 플러그인: options.plugins.vLabel={on:true, only:[데이터셋 번호], below:[선 그래프 번호], fmt:v=>.., size:15} */
const vLabel={id:'vLabel',afterDatasetsDraw(ch,_,o){if(!o||!o.on)return;const ctx=ch.ctx;ctx.save();
  ch.data.datasets.forEach((ds,di)=>{if(o.only&&!o.only.includes(di))return;const m=ch.getDatasetMeta(di);if(m.hidden)return;const below=o.below&&o.below.includes(di);
    m.data.forEach((el,i)=>{const v=ds.data[i];if(v==null)return;const txt=o.fmt?o.fmt(v,di,i):v;const p=el.tooltipPosition();
      ctx.font=`700 ${o.size||15}px ${FONT}`;ctx.fillStyle=typeof o.color==='function'?o.color(v,di,i):(o.color||C.ink);
      if(below){ctx.textAlign='center';ctx.textBaseline='top';ctx.lineWidth=4;ctx.strokeStyle='#fff';ctx.strokeText(txt,p.x,el.y+8);ctx.fillStyle=C.slateD;ctx.fillText(txt,p.x,el.y+8)}
      else if(ch.options.indexAxis==='y'){ctx.textBaseline='middle';ctx.textAlign=v<0?'right':'left';ctx.fillText(txt,el.x+(v<0?-6:6),el.y)}
      else{ctx.textAlign='center';ctx.textBaseline='bottom';ctx.fillText(txt,p.x,el.y-4)}})});ctx.restore()}};
Chart.register(vLabel);
const chartsBySlide={};
function mk(id,cfg){const el=document.getElementById(id),idx=slides.indexOf(el.closest('.slide'));const c=new Chart(el,cfg);(chartsBySlide[idx]=chartsBySlide[idx]||[]).push(c);return c}
const grid={color:C.line,drawTicks:false},noGrid={display:false};


/* ===== 시간별 SMP · 가격결정 연료 ===== */
{
const $=id=>document.getElementById(id);
const HASH=decodeURIComponent(location.hash.slice(1)); /* 덱 시작 코드가 주소의 #을 바꾸기 전에 읽어 둠 */
const CAT={coal:['석탄','#8F99A6'],ind:['개별연료비·직도입 LNG','#3399FF'],avg:['평균연료비 LNG','#9B30B0'],etc:['기타','#F0B400']};
const ORDER=['coal','ind','avg','etc'];
const f1=v=>v==null?'-':(+v).toLocaleString('ko-KR',{minimumFractionDigits:1,maximumFractionDigits:1});
const DOW='일월화수목금토';
$('lg').innerHTML=ORDER.map(k=>`<span><i style="background:${CAT[k][1]}"></i>${CAT[k][0]}</span>`).join('');
let D=null,chL=null,chS=null,YMAX=200;
const OK=!!window.Chart;
if(OK){Chart.defaults.animation=false}
const YW=60; /* 두 그래프 왼쪽 축 폭을 맞춰 시간축 정렬 */
const tipStyle={displayColors:false,titleFont:{size:14,weight:'700'},bodyFont:{size:13}};

function rows(){const ms=[...document.querySelectorAll('#months input:checked')].map(x=>x.value);
  const out=[];Object.keys(D.days).sort().forEach(d=>{if(!ms.includes(d.slice(0,7)))return;const r=D.days[d];if(!r.wd)return; /* 평일만 */
    for(let h=0;h<24;h++)out.push({d,h,smp:r.smp[h],u:r.u[h],lb:r.lb[h],c:r.c[h],wd:r.wd,a:r.a})});return {ms,out}}
function title(p){const dt=new Date(p.d+'T00:00:00');return `${+p.d.slice(5,7)}/${+p.d.slice(8)}(${DOW[dt.getDay()]}) ${p.h+1}시`}
function body(p){const o=[`SMP ${f1(p.smp)}원/kWh`,'',`추정 가격결정 발전기: ${p.u}`,(p.lb===CAT[p.c][0]?`연료: ${p.lb}`:`연료: ${p.lb} (${CAT[p.c][0]})`)];
  const a=Object.entries(p.a||{});if(a.length)o.push('',`그날 공식 연료별 결정(24시간): ${a.map(([k,v])=>k+' '+v).join(' · ')}`);return o}

function render(){
  const {ms,out}=rows();
  if(!out.length){$('msg').textContent='표시할 달을 하나 이상 고르세요';$('sum').innerHTML='';if(chL){chL.destroy();chS.destroy();chL=chS=null}return}
  const first=out[0].d,last=out[out.length-1].d;
  $('per').textContent=`${+first.slice(5,7)}.${+first.slice(8)}~${+last.slice(5,7)}.${+last.slice(8)}`;
  const cnt={coal:0,ind:0,avg:0,etc:0},sm={coal:[],ind:[],avg:[],etc:[]};out.forEach(p=>{cnt[p.c]++;sm[p.c].push(p.smp)});
  const n=out.length,mean=a=>a.length?a.reduce((s,v)=>s+v,0)/a.length:null;
  let ag=0,tot=0;[...new Set(out.map(p=>p.d))].forEach(d=>{const r=D.days[d];if(r.tot){ag+=r.ag;tot+=r.tot}});
  $('sum').innerHTML=ORDER.map(k=>`<div class="card kpi" style="border-top-color:${CAT[k][1]}"><div class="k1">${CAT[k][0]}</div><div class="k2">${(cnt[k]/n*100).toFixed(1)}<small>%</small></div><div class="k3">${cnt[k]}시간 · 평균 ${f1(mean(sm[k]))}원</div></div>`).join('')+
    `<div class="card kpi ref" title="가격표만으로 추정한 연료(석탄·LNG 등)의 날짜별 시간 수가 전력거래소 '연료원별 SMP 결정 횟수(일별)'와 겹치는 비율"><div class="k1">참고 · 연료 일치율</div><div class="k2 b">${tot?(ag/tot*100).toFixed(1):'-'}<small>%</small></div><div class="k3">공식 일별 집계 대비</div></div>`;
  const top=ORDER.slice().sort((a,b)=>cnt[b]-cnt[a])[0];
  $('msg').innerHTML=`평일 ${n.toLocaleString()}시간 중 <span style="color:${CAT[top][1]}">${CAT[top][0]}</span>이 ${(cnt[top]/n*100).toFixed(0)}% 가격 결정 · 평균연료비 LNG 결정 시간 평균 SMP <span class="em">${f1(mean(sm.avg))}원</span>`;
  const labels=out.map(p=>p.h===0?`${+p.d.slice(5,7)}/${+p.d.slice(8)}`:'');
  if(!OK)return;
  if(chL){chL.destroy();chS.destroy()}
  const nd=out.length/24,step=nd>40?5:nd>18?2:1;const tick={autoSkip:false,maxRotation:0,callback:(v,i)=>{const p=out[i];if(p.h!==0)return null;return Math.floor(i/24)%step===0?labels[i]:null}};
  chL=new Chart($('cL'),{type:'line',data:{labels,datasets:[{data:out.map(p=>p.smp),borderColor:'#0B3D66',borderWidth:1.5,pointRadius:0,pointHoverRadius:5,pointHoverBackgroundColor:out.map(p=>CAT[p.c][1]),tension:0}]},
    options:{interaction:{mode:'index',intersect:false},plugins:{legend:{display:false},tooltip:{...tipStyle,callbacks:{title:c=>title(out[c[0].dataIndex]),label:c=>body(out[c.dataIndex])}}},
      scales:{x:{grid:{color:c=>out[c.index]&&out[c.index].h===0?'#E3E8EE':'transparent'},ticks:tick},y:{min:0,max:YMAX,afterFit:a=>{a.width=YW},grid:{color:'#EEF1F5'},ticks:{stepSize:40},border:{display:false},title:{display:true,text:'원/kWh'}}}}});
  chS=new Chart($('cS'),{type:'bar',data:{labels,datasets:[{data:out.map(()=>1),backgroundColor:out.map(p=>CAT[p.c][1]),barPercentage:1,categoryPercentage:1,borderWidth:0}]},
    options:{interaction:{mode:'index',intersect:false},plugins:{legend:{display:false},tooltip:{...tipStyle,callbacks:{title:c=>title(out[c[0].dataIndex]),label:c=>body(out[c.dataIndex])}}},
      scales:{x:{grid:{display:false},ticks:tick},y:{display:true,min:0,max:1,afterFit:a=>{a.width=YW},ticks:{display:false},grid:{display:false},border:{display:false}}}}});
}

fetch('data/hourly_est.json?'+Date.now()).then(r=>{if(!r.ok)throw new Error(r.status);return r.json()}).then(j=>{D=j;
  /* 세로축은 달 선택과 상관없이 전체 기간 최댓값 기준으로 고정 */
  YMAX=Math.max(200,Math.ceil(Math.max(...Object.values(D.days).flatMap(r=>r.smp))/20)*20);
  const ms=[...new Set(Object.keys(D.days).map(d=>d.slice(0,7)))].sort();
  const hm=HASH,lastM=ms.includes(hm)?hm:ms[ms.length-1]; /* hourly.html#2026-11 처럼 열면 그 달 표시 */
  $('months').innerHTML=ms.map(m=>{const ds=Object.keys(D.days).filter(d=>d.startsWith(m)).sort(),e=+ds[ds.length-1].slice(8),full=new Date(+m.slice(0,4),+m.slice(5),0).getDate();
    return `<label><input type="checkbox" value="${m}" ${m===lastM?'checked':''}>${+m.slice(5)}월${e<full?` (~${e}일)`:''}</label>`}).join('');
  $('months').insertAdjacentHTML('beforeend','<button type="button" class="lk" id="allBtn" aria-pressed="false">한번에 보기</button>');
  const boxes=[...document.querySelectorAll('#months input')];
  $('months').addEventListener('change',e=>{if(e.target.type!=='checkbox')return;boxes.forEach(b=>b.checked=b===e.target);$('allBtn').setAttribute('aria-pressed','false');render()});
  $('allBtn').onclick=()=>{boxes.forEach(b=>b.checked=true);$('allBtn').setAttribute('aria-pressed','true');render()};
  $('note').textContent=`※ 선·띠에 마우스를 올리면 추정 가격결정 발전기·연료 표시 · 발전기·연료는 사업기획팀 발전가격 순위표로 추정 후 날짜별 석탄·LNG 시간 수를 전력거래소 연료별 SMP 결정 횟수에 맞춤(발전기는 추정치) · 연료 일치율 = 보정 전 추정이 공식 일별 집계와 겹치는 비율(LNG 평균·개별 구분, 발전기명은 검증 불가) · 기타 = 원자력·LPG·중유 등 · ${D.from}~${D.to}`;
  render()}).catch(e=>{$('msg').textContent='자료를 불러오지 못했습니다: '+e.message});
}
/* 시작 · 인쇄 */
go(0);
</script>
